<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — PSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <p class="login-brand">PS<span>C</span> Admin</p>
    <p class="login-sub">Sign in to manage messages and site content.</p>

    <div class="form-error" id="loginError"></div>

    <form id="loginForm">
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div class="app" id="app">

  <aside class="sidebar">
    <div class="sidebar-brand">
      PS<span>C</span>
      <small>Admin Panel</small>
    </div>

    <button class="nav-item active" data-panel="inbox">
      Messages
      <span class="count" id="newCount" style="display:none;">0</span>
    </button>
    <button class="nav-item" data-panel="content">
      Site Content
    </button>

    <div class="sidebar-foot">
      <div class="sidebar-user" id="sidebarUser"></div>
      <a href="/" class="view-site-link" target="_blank" rel="noopener">↗ View live site</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%;">Sign Out</button>
    </div>
  </aside>

  <main class="main">

    <!-- ---------- MESSAGES PANEL ---------- -->
    <section class="panel active" id="panel-inbox">
      <div class="main-head">
        <div>
          <h1>Messages</h1>
          <p>Project requests submitted through the site's intake form.</p>
        </div>
      </div>

      <div class="inbox-layout">
        <div>
          <div class="filter-row">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="new">New</button>
            <button class="filter-chip" data-filter="read">Read</button>
            <button class="filter-chip" data-filter="archived">Archived</button>
          </div>
          <div class="submission-list" id="submissionList">
            <div class="empty-state">Loading…</div>
          </div>
        </div>

        <div id="detailWrap">
          <div class="empty-state" id="detailEmpty">Select a message to view its details.</div>
          <div class="detail-card" id="detailCard" style="display:none;"></div>
        </div>
      </div>
    </section>

    <!-- ---------- CONTENT PANEL ---------- -->
    <section class="panel" id="panel-content">
      <div class="main-head">
        <div>
          <h1>Site Content</h1>
          <p>Edit key text on the public site. Changes go live immediately after saving.</p>
        </div>
      </div>

      <div class="lang-tabs">
        <button class="lang-tab active" data-lang="en">English</button>
        <button class="lang-tab" data-lang="fa">فارسی</button>
      </div>

      <form class="content-form" id="contentForm" dir="ltr">
        <!-- Field groups are injected by admin.js -->
      </form>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/admin/js/admin.js" defer></script>
</body>
</html>
