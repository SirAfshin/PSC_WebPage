services:
  psc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psc-website
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Persist submissions and admin-edited content outside the container.
      - ./data:/app/data
